[project]
name = "s08-assignment"
version = "0.1.0"
description = "A Microsoft Foundry hosted document agent and cloud placement study"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "azure-ai-projects==2.3.0",
    "azure-identity==1.25.3",
    "openai==2.54.0",
    "python-dotenv==1.2.3",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
